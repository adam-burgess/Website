# Settings for the writing editor at /admin/ (Sveltia CMS).
# Docs: https://sveltiacms.app/en/docs
# The fields below must match the schema in src/content.config.ts.

backend:
  name: github
  repo: adam-burgess/Website
  branch: main
  # Commit messages the editor writes when you save or delete a post.
  commit_messages:
    create: 'Add {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'

site_url: https://jumari.com.au
app_title: Write · jumari.com.au

# Global fallback; each collection below stores photos next to the post instead.
media_folder: public/media
public_folder: /media

output:
  # Leave empty optional fields (e.g. "Updated") out of the file entirely,
  # so the site's schema doesn't reject an empty value.
  omit_empty_optional_fields: true

# Both lists read the same folder, src/content/posts/. Each post's Section field
# (`section:` in the file) decides which list it shows in: the `filter` lines below.
# Change a post's Section and save to move it to the other list and section.
collections:
  - name: notes
    label: Field Notes
    label_singular: Field note
    folder: src/content/posts
    filter: { field: section, value: notes }
    # One folder per post (posts/<name>/index.md) so its photos live beside it.
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug: '{{title}}'
    summary: "{{title}} — {{date}}{{draft | ternary(' (draft)', '')}}"
    sortable_fields: [date, title]
    preview_path: /notes/{{slug}}/
    # Each field is named here (&title, &date, …) and reused by Off the Bench (*title, *date, …).
    # Only Section differs: its starting value is this list's section.
    fields:
      - name: section
        label: Section
        widget: select
        options: &sections
          - { label: Field Notes, value: notes }
          - { label: Off the Bench, value: bench }
        default: notes
        hint: Change this and save to move the post to the other section. Its web address changes too.
      - &title { name: title, label: Title, widget: string }
      - &description
        name: description
        label: Description
        widget: text
        hint: One or two sentences. Shown under the title and on the home-page card.
      - &date
        name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - &updated
        name: updated
        label: Updated
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
        hint: Only if you've changed the post after publishing.
      - &tags
        name: tags
        label: Tags
        widget: list
        required: false
        hint: Short topic labels, e.g. RF, Books. Press Enter or comma between them.
      - &cover
        name: cover
        label: Card picture
        widget: image
        required: false
        hint: Optional. Shown at the top of the post and on its home-page card, always as a 2:1 (landscape) crop. Any shape works; use one at least 1600 px wide and pick the crop below.
      - &coverCrop
        name: coverCrop
        label: Card picture crop
        widget: cover-crop
        required: false
        hint: Drag the box to choose what's shown; drag its corner to zoom in or out. Leave it alone to use the centre.
      - &coverAlt { name: coverAlt, label: Card picture description, widget: string, required: false }
      - &series
        name: series
        label: Series
        widget: string
        required: false
        hint: Optional. Posts with exactly the same series name are grouped, with a contents box on each.
      - &part
        name: part
        label: Part number
        widget: number
        value_type: int
        min: 1
        required: false
        hint: Optional. Order within the series; leave empty to order by date.
      - &draft
        name: draft
        label: Draft
        widget: boolean
        default: true
        hint: Drafts are saved to GitHub but hidden on the live site. Turn off to publish.
      - &body
        name: body
        label: Body
        widget: richtext
        modes: [rich_text, raw]
        hint: For maths, use Insert → Maths block, or switch to Markdown mode and type $…$ directly.

  - name: bench
    label: Off the Bench
    label_singular: Off the Bench piece
    folder: src/content/posts
    filter: { field: section, value: bench }
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug: '{{title}}'
    summary: "{{title}} — {{date}}{{draft | ternary(' (draft)', '')}}"
    sortable_fields: [date, title]
    preview_path: /off-the-bench/{{slug}}/
    fields:
      - name: section
        label: Section
        widget: select
        options: *sections
        default: bench
        hint: Change this and save to move the post to the other section. Its web address changes too.
      - *title
      - *description
      - *date
      - *updated
      - *tags
      - *cover
      - *coverCrop
      - *coverAlt
      - *series
      - *part
      - *draft
      - *body
